<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results - East Boom CHC</title>
    <link rel="stylesheet" href="style.css">
    <script src="search-data.js"></script>
</head>
<body>
    <nav class="sidebar">
        <h2>Help Center</h2>
        <div class="sidebar-search">
            <input type="text" id="searchInput" placeholder="Search manual..." onkeypress="handleSearch(event)">
            <button onclick="executeSearch()">🔍</button>
        </div>
        <script>
            function handleSearch(event) { if (event.key === 'Enter') executeSearch(); }
            function executeSearch() {
                let query = document.getElementById('searchInput').value.trim();
                if (query !== "") { window.location.href = "search.html?q=" + encodeURIComponent(query); }
            }
        </script>
        <ul>
            <li><a href="index.html">Welcome & Overview</a></li>
            <li><a href="dashboard.html">Using the Dashboard</a></li>
            <li><a href="patients.html">Patient Management</a></li>
            <li><a href="consultations.html">Clinical Consultations</a></li>
            <li><a href="location.html">Clinic Location & Info</a></li>
        </ul>
    </nav>

    <main class="content">
        <h1>Search Results</h1>
        <p>Showing results for: <strong id="searchTermDisplay" style="color: #1B5E35;">...</strong></p>

        <div id="resultsContainer">
        </div>
    </main>

    <script>
        // 1. Get the searched word from the URL (e.g., search.html?q=vitals)
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q').toLowerCase();

        document.getElementById('searchTermDisplay').innerText = '"' + query + '"';
        const resultsContainer = document.getElementById('resultsContainer');

        let foundResults = 0;

        // 2. Loop through the database to find matches
        for (let i = 0; i < searchIndex.length; i++) {
            let page = searchIndex[i];

            // Check if the query matches the title, description, or any keywords
            let matchesTitle = page.title.toLowerCase().includes(query);
            let matchesDesc = page.description.toLowerCase().includes(query);
            let matchesKeyword = page.keywords.some(kw => kw.includes(query));

            if (matchesTitle || matchesDesc || matchesKeyword) {
                foundResults++;

                // 3. Create the result HTML
                resultsContainer.innerHTML += `
                        <div class="search-result-item">
                            <h3><a href="${page.url}">${page.title}</a></h3>
                            <p>${page.description}</p>
                        </div>
                    `;
            }
        }

        // 4. If nothing was found
        if (foundResults === 0) {
            resultsContainer.innerHTML = `
                    <div class="tip-box" style="border-left-color: #d9534f;">
                        <strong>No results found.</strong> We couldn't find any pages matching "${query}". Try using different keywords like "vitals", "register", or "queue".
                    </div>
                `;
        }
    </script>

    <button class="chat-toggle" onclick="toggleChat()" title="Open Help Desk">💬</button>

    <div class="chat-container" id="chatContainer">
        <div class="chat-header">
            <div class="header-info">
                <div class="chat-avatar">🤖</div>
                <div class="header-text">
                    <h4>Help Desk</h4>
                    <span class="status"><span class="status-dot"></span> Online</span>
                </div>
            </div>
            <button class="close-btn" onclick="toggleChat()">✖</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="bot-message">Hello! Welcome to the East Boom CHC Help Desk. How can I assist you today?</div>
        </div>

        <div class="chat-chips">
            <button class="chip" onclick="sendQuickReply('How do I register a patient?')">Register Patient</button>
            <button class="chip" onclick="sendQuickReply('What do the queue colors mean?')">Queue Colors</button>
            <button class="chip" onclick="sendQuickReply('Where are you located?')">Clinic Location</button>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" title="Send">➤</button>
        </div>
    </div>

    <script src="knowledgebase.js"></script>
    <script src="chatbot.js"></script>
</body>
</html>
